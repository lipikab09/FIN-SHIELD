services:
  api:
    build: .
    container_name: finshield-api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    command: uvicorn finshield.serving.app:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    container_name: finshield-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env.example
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      - api
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
